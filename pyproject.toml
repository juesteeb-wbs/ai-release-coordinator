[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-release-agent-demo"
version = "1.0.0"
description = "Baseline FastAPI support-ticket API for an AI Release Agent demonstration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.0.0",
  "email-validator>=2.0,<3.0",
  "fastapi>=0.115.3,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "starlette>=0.40.0,<2.0",
  "truststore>=0.10.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.setuptools]
packages = ["app", "release_agent"]
